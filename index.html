<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bán hàng">
<meta name="theme-color" content="#1f4fd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Bán hàng</title>
<style>
:root{--bg:#eef1f4;--sf:#fff;--ink:#16202b;--mu:#6b7683;--ln:#dde2e8;--ac:#1f4fd8;--act:#fff;--am:#f5b301;--dg:#c0291f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--sf:#182029;--ink:#e8edf2;--mu:#93a0ae;--ln:#283341;--ac:#6b95ff;--act:#0b1220;--am:#f5b301;--dg:#ff7b70}}
:root[data-theme="dark"]{--bg:#0f141a;--sf:#182029;--ink:#e8edf2;--mu:#93a0ae;--ln:#283341;--ac:#6b95ff;--act:#0b1220;--am:#f5b301;--dg:#ff7b70}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:150px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{padding:16px 16px 0}
h1{font-size:20px;margin:0}
main{padding:10px 16px}
.mu{color:var(--mu)}
.in{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:640px){#grid{grid-template-columns:repeat(4,1fr)}}
.pc{position:relative;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-height:92px}
.pc b{font-weight:600;padding-right:26px}
.pc span{color:var(--ac);font-weight:700;font-variant-numeric:tabular-nums}
.pc i{font-style:normal;font-size:12px;color:var(--mu)}
.pc em{position:absolute;top:8px;right:8px;background:var(--am);color:#241a00;font-style:normal;font-weight:700;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:13px}
.pc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:4px;background:var(--bg)}
.th{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--bg)}
.pv{width:100%;max-height:220px;object-fit:cover;border-radius:10px}
.pc.out{opacity:.5}
#grid.ls{grid-template-columns:1fr;gap:8px}
#grid.ls .pc{flex-direction:row;align-items:center;gap:10px;min-height:0;padding:8px 12px}
#grid.ls .pc img{width:46px;height:46px;aspect-ratio:auto;margin:0;flex:none}
#grid.ls .pc b{flex:1;padding-right:0}
#grid.ls .pc i{font-size:11px;text-align:right;min-width:64px}
#grid.ls .pc em{position:static}
.pc{cursor:pointer;user-select:none;-webkit-user-select:none}
.pc.sel{border-color:var(--ac)}
.st{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.st button{width:42px;height:38px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);font-size:20px}
.st b{padding:0;min-width:24px;text-align:center;font-size:17px}
#grid.ls .st{margin:0;flex:none}
.row{cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 2px;padding-bottom:2px}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-size:14px}
.chip.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.warn{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--am);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.warn .btn{padding:8px 12px;white-space:nowrap}
.dt{border-bottom:1px solid var(--ln)}
.dt summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;cursor:pointer;list-style:none}
.dt summary::-webkit-details-marker{display:none}
.dt summary b::after{content:' ▾';color:var(--mu)}
.ev{display:flex;justify-content:space-between;gap:10px;padding:8px 0 8px 12px;font-size:14px;border-top:1px dashed var(--ln)}
.ev span{font-variant-numeric:tabular-nums;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mu);font-size:13px}
nav button.on{color:var(--ac);font-weight:700}
#cb{position:fixed;left:12px;right:12px;bottom:calc(52px + env(safe-area-inset-bottom,0px) + 8px);display:none;justify-content:space-between;align-items:center;background:var(--ac);color:var(--act);border:0;border-radius:14px;padding:14px 18px;z-index:4;font-size:16px}
#cb b{font-size:20px;font-variant-numeric:tabular-nums}
#m{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#m.open{display:flex}
.box{background:var(--sf);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.box h2{margin:0 0 6px;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row b{font-variant-numeric:tabular-nums}
.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-weight:600}
.btn.p{background:var(--ac);color:var(--act);border-color:var(--ac)}
.btn.d{color:var(--dg)}
.acts{display:flex;gap:10px;margin-top:14px}
.acts .p{flex:1}
.q{display:flex;align-items:center;gap:10px}
.q button{width:34px;height:34px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);font-size:18px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px}
.stat small{color:var(--mu)}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat .w{grid-column:1/-1}
.stat .w b{font-size:28px;color:var(--ac)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:32px 0}
.empty .btn{margin-top:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;display:none}
.rc{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.rc hr{border:0;border-top:1px dashed var(--mu)}
.rc .l{display:flex;justify-content:space-between;gap:8px;margin:4px 0}
textarea.in{min-height:90px;font-size:12px}
@media print{body>*:not(#m){display:none!important}#m{position:static;background:none;display:block}.box{max-height:none;padding:0}.np{display:none!important}}
</style>
</head>
<body>
<header><h1 id="sn"></h1></header>
<main id="v"></main>
<button id="cb" onclick="openCart()"></button>
<nav>
<button data-t="sell" onclick="go('sell')">Bán hàng</button>
<button data-t="prod" onclick="go('prod')">Sản phẩm</button>
<button data-t="cus" onclick="go('cus')">Khách hàng</button>
<button data-t="rep" onclick="go('rep')">Báo cáo</button>
<button data-t="set" onclick="go('set')">Cài đặt</button>
</nav>
<div id="m" onclick="if(event.target===this)closeM()"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Math.round(n).toLocaleString('vi-VN')+' đ';
let S={products:[],sales:[],customers:[],pays:[],rets:[],tags:['Tiền mặt','Chuyển khoản'],store:'Cửa hàng của tôi',seq:0};
try{const r=localStorage.getItem('pos_v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(k){if(!k)S.mod=Date.now();try{localStorage.setItem('pos_v1',JSON.stringify(S))}catch(e){toast('Không lưu được dữ liệu. Hãy xem cảnh báo ở đầu trang.')}if(!k)bkSoon()}
let tab='sell',q='',cart={},disc=0,paid='',per='today',cust='',cq='',pimg='',cf='in',rq={},rs=null,rm='cash',ptag=S.lastTag||'',pnote='',pnote2='',payId='',payAmt=null;
const prod=id=>S.products.find(p=>p.id===id);
const avail=p=>p.stock===null||p.stock===undefined?Infinity:p.stock;
const sub=()=>Object.keys(cart).reduce((a,id)=>a+(prod(id)?prod(id).price*cart[id]:0),0);
const total=()=>Math.max(0,sub()-disc);
const cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2000)}
function modal(h){$('#m').innerHTML='<div class="box">'+h+'</div>';$('#m').classList.add('open')}
function closeM(){$('#m').classList.remove('open')}
function ask(msg,fn){window._f=fn;modal(`<h2>${msg}</h2><div class="acts"><button class="btn" onclick="closeM()">Hủy</button><button class="btn p" onclick="closeM();_f()">Đồng ý</button></div>`)}
function go(t){tab=t;render()}
function bar(){const n=cnt(),b=$('#cb');b.style.display=n&&tab==='sell'?'flex':'none';b.innerHTML=`<span>${n} món · Xem giỏ hàng</span><b>${money(total())}</b>`}
function render(){
 $('#sn').textContent=S.store;
 $('#v').innerHTML=sysWarn()+{sell:sellV,prod:prodV,cus:cusV,rep:repV,set:setV}[tab]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));if(tab==='set')loadSnaps();
 bar();
}
/* Bán hàng */
function cats(){return [...new Set(S.products.map(p=>p.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'))}
function pl(){return [...S.products].sort((a,b)=>b.id.localeCompare(a.id)).filter(p=>cf==='out'?avail(p)<=0:avail(p)>0)}
function chips(){const n=S.products.filter(p=>avail(p)>0).length,o=S.products.length-n;return `<div class="chips"><button class="chip ${cf==='out'?'':'on'}" onclick="setCat('in')">Còn hàng (${n})</button><button class="chip ${cf==='out'?'on':''}" onclick="setCat('out')">Hết hàng (${o})</button></div>`}
function setCat(v){cf=v;render()}
function togView(){S.view=S.view==='list'?'grid':'list';save();render()}
function sellV(){return bkBanner()+`<div style="display:flex;gap:8px"><input class="in" style="flex:1;min-width:0" placeholder="Tìm sản phẩm" value="${esc(q)}" oninput="q=this.value;$('#grid').innerHTML=grid()"><button class="btn" style="white-space:nowrap" onclick="togView()">${S.view==='list'?'Dạng ô':'Danh sách'}</button></div>${chips()}<div id="grid" class="${S.view==='list'?'ls':''}">${grid()}</div>`}
function grid(){
 if(!S.products.length)return `<div class="empty">Chưa có sản phẩm nào.<br><button class="btn p" onclick="go('prod')">Thêm sản phẩm</button></div>`;
 const l=pl().filter(p=>nz(p.name).includes(nz(q)));
 if(!l.length)return '<div class="empty">Không có sản phẩm nào trong mục này.</div>';
 return l.map(p=>`<div class="pc ${avail(p)<=0?'out':''}${cart[p.id]?' sel':''}" onclick="add('${p.id}')">${p.img?`<img src="${p.img}" alt="">`:''}<b>${esc(p.name)}</b><span>${money(p.price)}</span><i>${p.stock==null?'Không theo dõi kho':avail(p)<=0?'Hết hàng':'Còn '+p.stock}</i>${cart[p.id]?`<div class="st"><button onclick="event.stopPropagation();adj('${p.id}',-1)">−</button><b>${cart[p.id]}</b><button onclick="event.stopPropagation();adj('${p.id}',1)">+</button></div>`:''}</div>`).join('');
}
function adj(id,d){const p=prod(id),n=(cart[id]||0)+d;if(d>0&&n>avail(p)){toast('Không đủ hàng trong kho');return}if(n<=0)delete cart[id];else cart[id]=n;$('#grid').innerHTML=grid();bar()}
function add(id){const p=prod(id);if((cart[id]||0)>=avail(p)){toast('Không đủ hàng trong kho');return}cart[id]=(cart[id]||0)+1;$('#grid').innerHTML=grid();bar()}
function chg(id,d){const p=prod(id),n=(cart[id]||0)+d;if(d>0&&n>avail(p)){toast('Không đủ hàng trong kho');return}
 if(n<=0)delete cart[id];else cart[id]=n;
 $('#grid').innerHTML=grid();
 if(!cnt()){closeM();bar()}else openCart()}
function clearCart(){cart={};disc=0;paid='';cust='';pnote='';closeM();$('#grid').innerHTML=grid();bar()}
function openCart(){
 const ids=Object.keys(cart);if(!ids.length)return;
 modal(`<h2>Giỏ hàng</h2>`+ids.map(id=>{const p=prod(id);return `<div class="row"><div><b>${esc(p.name)}</b><br><small class="mu">${money(p.price)}</small></div><div class="q"><button onclick="chg('${id}',-1)">−</button><b>${cart[id]}</b><button onclick="chg('${id}',1)">+</button></div></div>`}).join('')+
 `<label>Khách hàng</label>${custRow()}<label>Giảm giá (nhập theo nghìn đồng: 50 = 50.000 đ)</label><input class="in" type="number" inputmode="decimal" step="any" value="${disc?disc/1000:''}" oninput="disc=Math.round((+this.value||0)*1000);upd()"><div class="mu" id="dsp" style="font-size:13px;margin-top:4px"></div>
 <label>Khách đưa (nhập theo nghìn đồng: 4500 = 4.500.000 đ). Đưa thiếu thì ghi nợ hoặc trừ số dư</label><input class="in" type="number" inputmode="decimal" step="any" value="${paid===''?'':paid/1000}" oninput="paid=this.value===''?'':String(Math.round(+this.value*1000));upd()"><div class="mu" id="pdp" style="font-size:13px;margin-top:4px"></div>${tagBox('c')}
 <div class="row"><span>Tổng cộng</span><b id="tt" style="font-size:22px"></b></div>
 <div class="row"><span>Thừa / còn nợ</span><b id="ch"></b></div>
 <div class="acts"><button class="btn d" onclick="clearCart()">Xóa giỏ</button><button class="btn p" onclick="pay()">Thanh toán</button></div>`);
 upd();
}
function upd(){const t=total();$('#tt').textContent=money(t);$('#dsp').textContent=disc?'= '+money(disc):'';$('#pdp').textContent=paid===''?'':'= '+money(+paid);$('#ch').textContent=paid===''?'—':+paid>=t?ovTxt(+paid-t):(cust&&cdebt(cust)<0?'Trừ số dư ':'Nợ ')+money(t-paid);bar()}
function pay(){
 if(paid!==''&&+paid<total()&&!cust){toast('Khách đưa chưa đủ. Chọn khách hàng nếu muốn ghi nợ');return}
 const items=Object.keys(cart).map(id=>{const p=prod(id);return{id,name:p.name,price:p.price,qty:cart[id]}});
 S.seq=(S.seq||0)+1;
 const c=cus(cust);const s={id:uid(),n:S.seq,t:Date.now(),items,cid:c?c.id:'',cn:c?c.name:'',cp:c?c.phone:'',pm:ptag,pn:pnote,dp:c?Math.min(Math.max(0,(paid===''?total():+paid)-total()),Math.max(0,cdebt(c.id))):0,disc,total:total(),paid:paid===''?total():+paid};
 items.forEach(i=>{const p=prod(i.id);if(p&&p.stock!=null)p.stock-=i.qty});
 S.sales.push(s);save();
 cart={};disc=0;paid='';
 cust='';pnote='';S.lastTag=ptag;showRc(s.id,true);render();
}
function rcHtml(s){
 return `<div class="rc" id="rc"><div style="text-align:center"><b>${esc(S.store)}</b><br>${dt(s.t)}<br>Hóa đơn #${s.n}</div>${s.cn?`<div>Khách: ${esc(s.cn)} - ${esc(s.cp)}</div>`:''}<hr>`+
 s.items.map(i=>`<div class="l"><span>${esc(i.name)}<br>${i.qty} × ${money(i.price)}</span><span>${money(i.qty*i.price)}</span></div>`).join('')+
 `<hr>`+(s.disc?`<div class="l"><span>Giảm giá</span><span>−${money(s.disc)}</span></div>`:'')+
 `<div class="l"><b>Tổng cộng</b><b>${money(s.total)}</b></div><div class="l"><span>Khách đưa</span><span>${money(s.paid)}</span></div>${s.pm||s.pn?`<div class="l"><span>Nhận tiền</span><span>${esc(s.pm||'')}${s.pn?' · '+esc(s.pn):''}</span></div>`:''}${s.dp?`<div class="l"><span>Trừ vào công nợ cũ</span><span>${money(s.dp)}</span></div>`:''}${s.paid<s.total?`<div class="l"><b>Còn nợ</b><b>${money(s.total-s.paid)}</b></div>`:`<div class="l"><span>Tiền thừa</span><span>${money(s.paid-s.total-(s.dp||0))}</span></div>`}<hr><div style="text-align:center">Cảm ơn quý khách</div></div>`;
}
function showRc(id,fresh){
 const s=S.sales.find(x=>x.id===id);
 modal((fresh?'<h2 class="np">Đã thanh toán</h2>':'')+rcHtml(s)+`${retInfo(s.id)}<div class="acts np"><button class="btn" onclick="closeM()">Đóng</button><button class="btn" onclick="retOpen('${s.id}')">Hoàn hàng</button><button class="btn p" onclick="window.print()">In hóa đơn</button></div><div class="acts np" style="margin-top:8px"><button class="btn" style="flex:1" onclick="editS('${s.id}')">Sửa hóa đơn</button></div>`);
}
/* Sản phẩm */
function prodV(){
 return `<div class="bar"><b>${S.products.length} sản phẩm</b><button class="btn p" onclick="editP()">Thêm</button></div>${chips()}`+
 (S.products.length?pl().map(p=>`<div class="row" onclick="editP('${p.id}')">${p.img?`<img class="th" src="${p.img}" alt="">`:''}<div style="flex:1"><b>${esc(p.name)}</b><br><small class="mu">${p.stock==null?'Không theo dõi kho':'Tồn kho: '+p.stock}</small></div><b>${money(p.price)}</b><button class="btn d" style="padding:8px 10px" onclick="event.stopPropagation();delP('${p.id}')">Xóa</button></div>`).join(''):'<div class="empty">Bấm Thêm để tạo sản phẩm đầu tiên.</div>');
}
function editP(id){
 const p=id?prod(id):{name:'',price:'',stock:1};pimg=p.img||'';
 modal(`<h2>${id?'Sửa sản phẩm':'Thêm sản phẩm'}</h2><div id="pv">${pvH()}</div><input type="file" id="pf" accept="image/*" hidden onchange="pickImg(this)"><label>Tên sản phẩm</label><input class="in" id="pn" value="${esc(p.name)}"><label>Giá bán (nhập theo nghìn đồng: 15 = 15.000 đ)</label><input class="in" id="pp" type="number" inputmode="decimal" step="any" value="${p.price===''?'':p.price/1000}" oninput="$('#pv2').textContent=$('#pp').value===''?'':'= '+money(Math.round(+$('#pp').value*1000))"><div class="mu" id="pv2" style="font-size:13px;margin-top:4px">${p.price===''?'':'= '+money(p.price)}</div><label>Số lượng tồn kho (để trống nếu không theo dõi)</label><input class="in" id="ps" type="number" inputmode="numeric" value="${p.stock==null?'':p.stock}">
 <div class="acts">${id?`<button class="btn d" onclick="delP('${id}')">Xóa</button>`:''}<button class="btn p" onclick="saveP('${id||''}')">Lưu</button></div>`);
}
function saveP(id){
 const name=$('#pn').value.trim(),price=Math.round((+$('#pp').value)*1000),st=$('#ps').value;
 if(!name||!(price>=0)||$('#pp').value===''){toast('Nhập tên và giá bán');return}
 const stock=st===''?null:+st;
 
 if(id){Object.assign(prod(id),{name,price,stock,img:pimg})}else S.products.unshift({id:uid(),name,price,stock,img:pimg});
 save();closeM();render();
}
function delP(id){ask('Xóa sản phẩm này?',()=>{S.products=S.products.filter(p=>p.id!==id);delete cart[id];save();render()})}
function pvH(){return (pimg?`<img class="pv" src="${pimg}" alt="">`:'')+`<div class="acts" style="margin:8px 0 0"><button class="btn" onclick="$('#pf').click()">${pimg?'Đổi ảnh':'Thêm ảnh'}</button>${pimg?`<button class="btn d" onclick="pimg='';$('#pv').innerHTML=pvH()">Xóa ảnh</button>`:''}</div>`}
function pickImg(inp){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{const im=new Image();

async function readZip(buf){
 const dv=new DataView(buf),u=new Uint8Array(buf),out={};let e=u.length-22;
 while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
 if(e<0)throw 0;
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
 for(let i=0;i<n;i++){
  const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(u.subarray(p+46,p+46+nl));
  if(/^xl\/(sharedStrings\.xml|worksheets\/sheet\d+\.xml)$/.test(name)){
   const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);let d=u.subarray(ds,ds+cs);
   if(m===8)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
   out[name]=new TextDecoder().decode(d);
  }
  p+=46+nl+el+cl;
 }
 return out;
}
function parseSheet(o){
 const dp=new DOMParser(),ss=[];
 if(o['xl/sharedStrings.xml'])dp.parseFromString(o['xl/sharedStrings.xml'],'text/xml').querySelectorAll('si').forEach(si=>ss.push([...si.querySelectorAll('t')].map(t=>t.textContent).join('')));
 const sk=Object.keys(o).filter(k=>/worksheets/.test(k)).sort()[0],rows=[];
 dp.parseFromString(o[sk],'text/xml').querySelectorAll('row').forEach(r=>{
  const row=[];
  r.querySelectorAll('c').forEach(c=>{
   const ci=(c.getAttribute('r')||'').replace(/\d/g,'').split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1,t=c.getAttribute('t'),q=c.querySelector('v');
   let v='';
   if(t==='s')v=ss[+(q?q.textContent:NaN)]||'';
   else if(t==='inlineStr')v=[...c.querySelectorAll('t')].map(x=>x.textContent).join('');
   else v=q?q.textContent:'';
   row[ci<0?row.length:ci]=v;
  });
  rows.push(row);
 });
 return rows;
}
function parseCSV(t){
 t=t.replace(/^\uFEFF/,'');
 const l1=t.split('\n')[0],d=(l1.match(/;/g)||[]).length>(l1.match(/,/g)||[]).length?';':',',rows=[];
 let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;
  else if(ch===d){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
  else c+=ch;
 }
 if(c!==''||r.length){r.push(c);rows.push(r)}
 return rows;
}
async function impCus(inp){

  });
  save();render();
  modal(`<h2>Đã nhập khách hàng</h2><div class="mu">Thêm mới ${add} · Cập nhật ${upd} · Bỏ qua ${skip} (thiếu tên hoặc số điện thoại)</div><div class="acts"><button class="btn p" style="flex:1" onclick="closeM()">Đóng</button></div>`);
 }catch(e){toast('Không đọc được file. Hãy dùng file .xlsx hoặc .csv')}

function chartH(){

 for(let i=11;i>=f;i--){

 }

 return m?`<div class="warn" style="border-color:var(--dg)"><span>${m}</span></div>`:'';
}
function ovTxt(ex){const d=cust?Math.min(ex,Math.max(0,cdebt(cust))):0;return d>0?'Trừ công nợ '+money(d)+(ex>d?' · Thừa '+money(ex-d):''):ex>0?'Thừa '+money(ex):'Đủ tiền'}
function bkSoon(){clearTimeout(window._bt);window._bt=setTimeout(()=>autoBak(),800)}
async function copyText(t){
 try{await navigator.clipboard.writeText(t);return true}catch(e){}
 try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}
}
async function copySnap(t){const o=(await IDB.all()).find(x=>x.t===t);toast(o&&await copyText(o.d)?'Đã sao chép văn bản. Hãy dán vào Ghi chú':'Không sao chép được')}
async function doRest(t){
 try{const o=(await IDB.all()).find(x=>x.t===t);if(!o)return;S=Object.assign({customers:[],pays:[],rets:[],tags:['Tiền mặt','Chuyển khoản'],store:'Cửa hàng',seq:0},JSON.parse(o.d));cart={};cust='';save();render();toast('Đã khôi phục')}catch(e){toast('Không khôi phục được')}
}
async function bootRestore(){
 try{
  if(S.products.length||S.sales.length||S.customers.length)return;
  const l=await IDB.all();if(!l.length)return;
  const o=l[0];
  if(!stoOK){await doRest(o.t);return}
  let nr=null;try{nr=localStorage.getItem('pos_nr')}catch(e){}
  if(String(nr)===String(o.t))return;
  modal(`<h2>Tìm thấy bản tự động lưu</h2><div class="mu">App chưa có dữ liệu nhưng có bản tự động lưu lúc ${dt(o.t)} (${o.p} sản phẩm, ${o.c} khách, ${o.n} hóa đơn). Khôi phục lại không?</div><div class="acts"><button class="btn" onclick="try{localStorage.setItem('pos_nr','${o.t}')}catch(e){};closeM()">Không, bắt đầu mới</button><button class="btn p" onclick="closeM();doRest(${o.t})">Khôi phục</button></div>`);
 }catch(e){}
}
function bkName(){return 'sao-luu-ban-hang-'+new Date().toISOString().slice(0,10)+'.json'}
function bkDone(){S.bk=Date.now();save(true);closeM();render();toast('Đã sao lưu')}
async function bkShareFile(){
 try{const f=new File([JSON.stringify(S)],bkName(),{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Sao lưu bán hàng'});bkDone();return}
  toast('Thiết bị chưa hỗ trợ chia sẻ file, hãy thử cách khác');
 }catch(e){if(!(e&&e.name==='AbortError'))toast('Không chia sẻ được file, hãy thử cách khác')}
}
async function bkShareText(){
 try{if(navigator.share){await navigator.share({title:'Sao lưu bán hàng',text:JSON.stringify(S)});bkDone();return}
  toast('Thiết bị chưa hỗ trợ, hãy chọn Sao chép văn bản');
 }catch(e){if(!(e&&e.name==='AbortError'))toast('Không gửi được, hãy chọn Sao chép văn bản')}
}
async function bkCopy(){if(await copyText(JSON.stringify(S)))bkDone();else{closeM();go('set');toast('Không sao chép tự động được, hãy bấm Sao chép dạng văn bản trong Cài đặt')}}
function bkDownload(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=bkName();document.body.appendChild(a);a.click();a.remove();bkDone()}catch(e){toast('Không tải được file')}}
function doBackup(){
 modal(`<h2>Sao lưu ra ngoài máy</h2><div class="mu" style="font-size:13px">Chọn nơi lưu. Trên iPhone, chọn Lưu vào Tệp rồi chọn iCloud Drive hoặc Trên iPhone của tôi.</div><div style="display:grid;gap:8px;margin-top:10px"><button class="btn p" onclick="bkShareFile()">Lưu vào Tệp / iCloud Drive (file)</button><button class="btn" onclick="bkShareText()">Gửi vào Ghi chú hoặc ứng dụng khác (văn bản)</button><button class="btn" onclick="bkCopy()">Sao chép văn bản (dán vào Ghi chú)</button><button class="btn" onclick="bkDownload()">Tải file về máy</button><button class="btn" onclick="closeM()">Đóng</button></div>`);
}
function cusRows(){return [['Tên','Số điện thoại','Ghi chú']].concat(S.customers.map(c=>[c.name,c.phone,c.note||'']))}
function expCus(){
 modal(`<h2>Xuất danh sách khách hàng</h2><div style="display:grid;gap:8px;margin-top:10px"><button class="btn p" onclick="expX('xlsx','share')">Chia sẻ file Excel (.xlsx) → chọn Tệp / iCloud</button><button class="btn" onclick="expX('csv','share')">Chia sẻ file CSV (.csv)</button><button class="btn" onclick="expX('xlsx','dl')">Tải file Excel về máy</button><button class="btn" onclick="expX('csv','dl')">Tải file CSV về máy</button><button class="btn" onclick="expCopy()">Sao chép dạng văn bản (dán vào Ghi chú hoặc Excel)</button><button class="btn" onclick="closeM()">Đóng</button></div>`);
}
async function expX(kind,mode){
 const rows=cusRows(),name='khach-hang.'+kind;
 const blob=kind==='xlsx'?xlsxBlob(rows):new Blob(['\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv'});
 const f=new File([blob],name,{type:kind==='xlsx'?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'text/csv'});
 if(mode==='share'){
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});closeM();return}toast('Thiết bị chưa hỗ trợ chia sẻ file, hãy chọn Tải file hoặc Sao chép')}
  catch(e){if(!(e&&e.name==='AbortError'))toast('Không chia sẻ được, hãy thử cách khác')}
  return;
 }
 try{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Đang tải '+name)}catch(e){toast('Không tải được file')}
}
async function expCopy(){toast(await copyText(cusRows().map(r=>r.join('\t')).join('\n'))?'Đã sao chép. Dán vào Ghi chú hoặc Excel':'Không sao chép được')}
function impMenu(){
 modal(`<h2>Nhập khách hàng</h2><div class="mu" style="font-size:13px">File gồm các cột: Tên, Số điện thoại, Ghi chú (không bắt buộc).</div><div style="display:grid;gap:8px;margin-top:10px"><button class="btn p" onclick="closeM();$('#xf').click()">Chọn file Excel (.xlsx) hoặc CSV</button></div><label>Hoặc dán văn bản (mỗi dòng một khách: Tên, Số điện thoại)</label><textarea class="in" id="itx" placeholder="Nguyễn Văn A, 0912345678"></textarea><div class="acts"><button class="btn" onclick="closeM()">Hủy</button><button class="btn p" onclick="impText()">Nhập</button></div>`);
}
function impText(){impRows($('#itx').value.split(/\r?\n/).filter(x=>x.trim()).map(l=>l.split(/\t|;|,/).map(x=>x.trim())))}
function impRows(rows){
 const st=/tên|ten|name|điện|phone|sdt|sđt/i.test((rows[0]||[]).join(' '))?1:0;
 let add=0,upd=0,skip=0;
 rows.slice(st).forEach(r=>{
  const name=String(r[0]||'').trim(),note=String(r[2]||'').trim();let ph=String(r[1]||'').replace(/[\s.\-()]/g,'');
  if(/^\d{9}$/.test(ph))ph='0'+ph;
  if(!name||!ph){skip++;return}
  const c=S.customers.find(x=>x.phone===ph);
  if(c){c.name=name;if(note)c.note=note;upd++}else{S.customers.push({id:uid(),name,phone:ph,note});add++}
 });
 save();render();
 modal(`<h2>Đã nhập khách hàng</h2><div class="mu">Thêm mới ${add} · Cập nhật ${upd} · Bỏ qua ${skip} (thiếu tên hoặc số điện thoại)</div><div class="acts"><button class="btn p" style="flex:1" onclick="closeM()">Đóng</button></div>`);
}
async function impCus(inp){
 const f=inp.files[0];inp.value='';if(!f)return;
 try{impRows(/\.xlsx$/i.test(f.name)?parseSheet(await readZip(await f.arrayBuffer())):parseCSV(await f.text()))}
 catch(e){toast('Không đọc được file. Hãy dùng .xlsx hoặc .csv, hoặc dán văn bản')}
}
function plist(){
 if(!S.products.length)return '<div class="empty">Bấm Thêm để tạo sản phẩm đầu tiên.</div>';
 const l=pl().filter(p=>nz(p.name).includes(nz(pq)));
 if(!l.length)return '<div class="empty">Không tìm thấy sản phẩm.</div>';
 return l.map(p=>`<div class="row" onclick="editP('${p.id}')">${p.img?`<img class="th" src="${p.img}" alt="">`:''}<div style="flex:1"><b>${esc(p.name)}</b><br><small class="mu">${p.stock==null?'Không theo dõi kho':'Tồn kho: '+p.stock}</small></div><b>${money(p.price)}</b><button class="btn d" style="padding:8px 10px" onclick="event.stopPropagation();delP('${p.id}')">Xóa</button></div>`).join('');
}
function prodV(){return `<div class="bar"><b>${S.products.length} sản phẩm</b><button class="btn p" onclick="editP()">Thêm</button></div><input class="in" placeholder="Tìm sản phẩm theo tên" value="${esc(pq)}" oninput="pq=this.value;$('#pls').innerHTML=plist()">${chips()}<div id="pls">${plist()}</div>`}
function edTot(){return Math.max(0,ed.items.reduce((a,i)=>a+i.price*i.qty,0)-ed.disc)}
function edU(){
 const t=edTot(),p=ed.paid===''?t:+ed.paid;
 $('#edt').textContent=money(t);
 $('#edp').textContent=(ed.paid===''?'':'= '+money(+ed.paid)+' · ')+(p>=t?(p>t?'Thừa '+money(p-t):'Đủ tiền'):'Nợ '+money(t-p));
}
function editS(id){
 const s=S.sales.find(x=>x.id===id);
 if(hasRet(id)){toast('Hóa đơn này đã có hoàn hàng nên chưa sửa được');return}
 ed={id,items:s.items.map(i=>({...i})),disc:s.disc||0,paid:String(s.paid),pm:s.pm||'',pn:s.pn||'',cid:s.cid||'',t:s.t};
 edR();
}
function edR(){
 const s=S.sales.find(x=>x.id===ed.id),z=n=>String(n).padStart(2,'0'),d=new Date(ed.t),c=cus(ed.cid);
 const dv=d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes());
 modal(`<h2>Sửa hóa đơn #${s.n}</h2>`+
 ed.items.map((i,k)=>`<div class="row"><div><b>${esc(i.name)}</b><br><small class="mu">${money(i.price)}</small></div><div class="q"><button onclick="edQ(${k},-1)">−</button><b>${i.qty}</b><button onclick="edQ(${k},1)">+</button></div></div>`).join('')+
 `<label>Thêm sản phẩm</label><select class="in" onchange="edAdd(this.value)"><option value="">Chọn sản phẩm...</option>${S.products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${money(p.price)}</option>`).join('')}</select>
 <label>Khách hàng</label><button class="row" onclick="edCust()"><span>${c?esc(c.name)+' · '+esc(c.phone):'Khách lẻ'}</span><span class="mu">Đổi</span></button>
 <label>Giảm giá (nghìn đồng: 50 = 50.000 đ)</label><input class="in" type="number" inputmode="decimal" step="any" value="${ed.disc?ed.disc/1000:''}" oninput="ed.disc=Math.round((+this.value||0)*1000);edU()">
 <label>Khách đưa (nghìn đồng, để trống = đủ tiền)</label><input class="in" type="number" inputmode="decimal" step="any" value="${ed.paid===''?'':ed.paid/1000}" oninput="ed.paid=this.value===''?'':String(Math.round(+this.value*1000));edU()">
 <div class="mu" id="edp" style="font-size:13px;margin-top:4px"></div>
 <div class="chips" style="flex-wrap:wrap;overflow:visible">${S.tags.map((g,i)=>`<button class="chip ${ed.pm===g?'on':''}" onclick="edTag(${i})">${esc(g)}</button>`).join('')}</div>
 <input class="in" style="margin-top:8px" placeholder="Ghi chú thanh toán" value="${esc(ed.pn)}" oninput="ed.pn=this.value">
 <label>Thời gian nhận tiền</label><input class="in" type="datetime-local" value="${dv}" onchange="ed.t=new Date(this.value).getTime()||ed.t">
 <div class="row"><span>Tổng cộng</span><b id="edt" style="font-size:20px"></b></div>
 <div class="acts"><button class="btn d" onclick="delS('${s.id}')">Xóa</button><button class="btn" onclick="showRc('${s.id}')">Hủy</button><button class="btn p" onclick="saveS()">Lưu</button></div>`);
 edU();
}
function edQ(k,d){const n=ed.items[k].qty+d;if(n<=0){if(ed.items.length<=1){toast('Hóa đơn phải còn ít nhất 1 món. Dùng nút Xóa nếu muốn hủy hóa đơn');return}ed.items.splice(k,1)}else ed.items[k].qty=n;edR()}
function edAdd(pid){const p=prod(pid);if(!p)return;const x=ed.items.find(i=>i.id===pid);if(x)x.qty++;else ed.items.push({id:p.id,name:p.name,price:p.price,qty:1});edR()}
function edTag(i){const g=S.tags[i];ed.pm=ed.pm===g?'':g;edR()}
function edCust(){modal(`<h2>Chọn khách hàng</h2><button class="row" onclick="ed.cid='';edR()"><b>Khách lẻ</b></button>`+S.customers.map(c=>`<button class="row" onclick="ed.cid='${c.id}';edR()"><div><b>${esc(c.name)}</b><br><small class="mu">${esc(c.phone)}</small></div></button>`).join('')+`<div class="acts"><button class="btn" style="flex:1" onclick="edR()">Quay lại</button></div>`)}
function saveS(){
 const s=S.sales.find(x=>x.id===ed.id),t=edTot(),paid=ed.paid===''?t:+ed.paid;
 if(paid<t&&!ed.cid){toast('Chọn khách hàng để ghi nợ');return}
 const old={},nw={};
 s.items.forEach(i=>old[i.id]=(old[i.id]||0)+i.qty);
 ed.items.forEach(i=>nw[i.id]=(nw[i.id]||0)+i.qty);
 for(const id in nw){const p=prod(id);if(p&&p.stock!=null&&nw[id]-(old[id]||0)>p.stock){toast('Không đủ hàng trong kho: '+p.name);return}}
 for(const id in old){const p=prod(id);if(p&&p.stock!=null)p.stock+=old[id]-(nw[id]||0)}
 for(const id in nw){if(old[id]===undefined){const p=prod(id);if(p&&p.stock!=null)p.stock-=nw[id]}}
 const c=cus(ed.cid),dp=c?Math.min(Math.max(0,paid-t),Math.max(0,cdebt(c.id,s.id))):0;
 Object.assign(s,{items:ed.items.map(i=>({...i})),disc:ed.disc,total:t,paid,dp,cid:c?c.id:'',cn:c?c.name:'',cp:c?c.phone:'',pm:ed.pm,pn:ed.pn,t:ed.t});
 save();render();showRc(s.id);toast('Đã lưu hóa đơn');
}
function delS(id){
 const s=S.sales.find(x=>x.id===id);
 ask('Xóa hóa đơn #'+s.n+'? Hàng sẽ được cộng lại vào kho.',()=>{
  s.items.forEach(i=>{const p=prod(i.id);if(p&&p.stock!=null)p.stock+=i.qty});
  S.sales=S.sales.filter(x=>x.id!==id);save();render();toast('Đã xóa hóa đơn');
 });
}
function rangeUI(){return `<div style="display:flex;gap:8px;margin-top:8px"><div style="flex:1"><label style="margin:0 0 4px">Từ ngày</label><input class="in" type="date" value="${rf}" onchange="rf=this.value;render()"></div><div style="flex:1"><label style="margin:0 0 4px">Đến ngày</label><input class="in" type="date" value="${rt}" onchange="rt=this.value;render()"></div></div>`}
function rcus(r){const s=S.sales.find(x=>x.id===r.sid);return s&&s.cn?' · '+esc(s.cn)+(s.cp?' · '+esc(s.cp):''):''}
function repList(k){
 const l=S.sales.filter(s=>s.t>=RF&&s.t<RT).sort((a,b)=>b.t-a.t),rl=(S.rets||[]).filter(r=>r.t>=RF&&r.t<RT).sort((a,b)=>b.t-a.t);
 let h='';
 if(k==='inv')h='<h2>Hóa đơn ('+l.length+')</h2>'+(l.length?l.map(s=>`<button class="row" onclick="showRc('${s.id}')"><div><b>Hóa đơn #${s.n}</b><br><small class="mu">${dt(s.t)}${s.cn?' · '+esc(s.cn)+(s.cp?' · '+esc(s.cp):''):''}${hasRet(s.id)?' · có hoàn hàng':''}</small></div><b>${money(s.total)}</b></button>`).join(''):'<div class="empty">Không có hóa đơn.</div>');
 else if(k==='ret')h='<h2>Hoàn hàng ('+rl.length+')</h2>'+(rl.length?rl.map(r=>`<button class="row" onclick="showRc('${r.sid}')"><div><b>Hoàn hóa đơn #${r.n}</b><br><small class="mu">${dt(r.t)}${rcus(r)} · ${r.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</small></div><b style="color:var(--dg)">−${money(r.amt)}</b></button>`).join(''):'<div class="empty">Không có lần hoàn hàng.</div>');
 else{
  const rows=[];l.forEach(s=>s.items.forEach(i=>rows.push({s,i})));
  h='<h2>Món đã bán ('+rows.length+')</h2>'+(rows.length?rows.map(x=>`<button class="row" onclick="showRc('${x.s.id}')"><div><b>${esc(x.i.name)} × ${x.i.qty}</b><br><small class="mu">Hóa đơn #${x.s.n} · ${dt(x.s.t)}${x.s.cn?' · '+esc(x.s.cn)+(x.s.cp?' · '+esc(x.s.cp):''):''}</small></div><b>${money(x.i.price*x.i.qty)}</b></button>`).join(''):'<div class="empty">Không có món nào.</div>');
 }
 modal(h+'<div class="acts"><button class="btn" style="flex:1" onclick="closeM()">Đóng</button></div>');
}
autoBak();bootRestore();
document.addEventListener('visibilitychange',()=>{if(document.hidden)autoBak()});
window.addEventListener('pagehide',()=>autoBak());
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
