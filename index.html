<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bán hàng">
<meta name="theme-color" content="#1f4fd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Bán hàng</title>
<style>
:root{--bg:#eef1f4;--sf:#fff;--ink:#16202b;--mu:#5d6874;--ln:#dde2e8;--ac:#1f4fd8;--act:#fff;--am:#f5b301;--dg:#b92319;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--sf:#182029;--ink:#e8edf2;--mu:#93a0ae;--ln:#283341;--ac:#6b95ff;--act:#0b1220;--am:#f5b301;--dg:#ff7b70}}
:root[data-theme="dark"]{--bg:#0f141a;--sf:#182029;--ink:#e8edf2;--mu:#93a0ae;--ln:#283341;--ac:#6b95ff;--act:#0b1220;--am:#f5b301;--dg:#ff7b70}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:150px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{padding:16px 16px 0}
h1{font-size:20px;margin:0}
main{padding:10px 16px}
.mu{color:var(--mu)}
.in{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:640px){#grid{grid-template-columns:repeat(4,1fr)}}
.pc{position:relative;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-height:92px}
.pc b{font-weight:600;padding-right:26px}
.pc span{color:var(--ac);font-weight:700;font-variant-numeric:tabular-nums}
.pc i{font-style:normal;font-size:12px;color:var(--mu)}
.pc em{position:absolute;top:8px;right:8px;background:var(--am);color:#241a00;font-style:normal;font-weight:700;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:13px}
.pc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:4px;background:var(--bg)}
.th{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--bg)}
.pv{width:100%;max-height:220px;object-fit:cover;border-radius:10px}
.pc.out{opacity:.5}
#grid.ls{grid-template-columns:1fr;gap:8px}
#grid.ls .pc{flex-direction:row;align-items:center;gap:10px;min-height:0;padding:8px 12px}
#grid.ls .pc img{width:46px;height:46px;aspect-ratio:auto;margin:0;flex:none}
#grid.ls .pc b{flex:1;padding-right:0}
#grid.ls .pc i{font-size:11px;text-align:right;min-width:64px}
#grid.ls .pc em{position:static}
.pc{cursor:pointer;user-select:none;-webkit-user-select:none}
.pc.sel{border-color:var(--ac)}
.st{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.st button{width:42px;height:38px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);font-size:20px}
.st b{padding:0;min-width:24px;text-align:center;font-size:17px}
#grid.ls .st{margin:0;flex:none}
.row{cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 2px;padding-bottom:2px}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-size:14px}
.chip.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.warn{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--am);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.warn .btn{padding:8px 12px;white-space:nowrap}
.dt{border-bottom:1px solid var(--ln)}
.dt summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;cursor:pointer;list-style:none}
.dt summary::-webkit-details-marker{display:none}
.dt summary b::after{content:' ▾';color:var(--mu)}
.ev{display:flex;justify-content:space-between;gap:10px;padding:8px 0 8px 12px;font-size:14px;border-top:1px dashed var(--ln)}
.ev span{font-variant-numeric:tabular-nums;white-space:nowrap}
.ckb{width:26px;height:26px;flex:none;accent-color:var(--ac)}
.vip{background:var(--am);color:#241a00;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px}
.in[type=date],.in[type=month]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;text-align:left;min-height:48px}
.qn{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:15px;pointer-events:none}
.odbar{position:sticky;bottom:calc(60px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:10px 0;background:var(--bg);z-index:3}
.odbar .p{flex:1}
.gr{color:var(--ok);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mu);font-size:13px}
nav button.on{color:var(--ac);font-weight:700}
#cb{position:fixed;left:12px;right:12px;bottom:calc(52px + env(safe-area-inset-bottom,0px) + 8px);display:none;justify-content:space-between;align-items:center;background:var(--ac);color:var(--act);border:0;border-radius:14px;padding:14px 18px;z-index:4;font-size:16px}
#cb b{font-size:20px;font-variant-numeric:tabular-nums}
#m{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#m.open{display:flex}
.box{background:var(--sf);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.box h2{margin:0 0 6px;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row b{font-variant-numeric:tabular-nums}
.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-weight:600}
.btn.p{background:var(--ac);color:var(--act);border-color:var(--ac)}
.btn.d{color:var(--dg)}
.acts{display:flex;gap:10px;margin-top:14px}
.acts .p{flex:1}
.q{display:flex;align-items:center;gap:10px}
.q button{width:34px;height:34px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);font-size:18px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px}
.stat small{color:var(--mu)}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat .w{grid-column:1/-1}
.stat .w b{font-size:28px;color:var(--ac)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:32px 0}
.empty .btn{margin-top:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;display:none}
.rc{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
.rc hr{border:0;border-top:1px dashed var(--mu)}
.rc .l{display:flex;justify-content:space-between;gap:10px;margin:8px 0}
textarea.in{min-height:90px;font-size:12px}
@media print{body>*:not(#m){display:none!important}#m{position:static;background:none;display:block}.box{max-height:none;padding:0}.np{display:none!important}}

:root{--ok:#0e7435;--or:#a15600;--pu:#7a3fd1;--tl:#08717a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#4cd27f;--or:#ffab40;--pu:#b794ff;--tl:#4fd1d1}}
:root[data-theme="dark"]{--ok:#4cd27f;--or:#ffab40;--pu:#b794ff;--tl:#4fd1d1}
.chip[style*="--tc"]{border-left:4px solid var(--tc)}
.chip.on[style*="--tc"]{background:var(--tc);border-color:var(--tc);color:var(--act);font-weight:700}
.pc i{color:var(--ok);font-style:normal;font-weight:600}
.pc.out i{color:var(--dg)}

.nt{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;cursor:pointer}
.nt.dg,.nr.dg{border-left-color:var(--dg)}.nt.or,.nr.or{border-left-color:var(--or)}.nt.ac,.nr.ac{border-left-color:var(--ac)}
.nt .nx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt.wrap{cursor:default}.nt.wrap .nx{white-space:normal}
.nt .nb{font-weight:700;color:var(--ac);white-space:nowrap}.nt .nc{color:var(--mu);font-size:20px;line-height:1}
.nr{border-left:4px solid var(--ac);padding-left:10px;gap:10px;align-items:center}.nr .nb{font-weight:700;color:var(--ac)}

/* Sổ giao dịch công nợ (v58) */
.lg{border-bottom:1px solid var(--ln);border-left:4px solid var(--ln);padding-left:10px}
.lg.up{border-left-color:var(--dg)}.lg.dn{border-left-color:var(--ok)}
.lg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;cursor:pointer}
.lg-l{min-width:0;flex:1}
.lg-r{text-align:right;white-space:nowrap}
.lg-r b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.lg-r small{font-size:12.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.lg-s{font-size:13px;color:var(--mu);margin-top:2px}
.lg-a{font-size:13px;margin-top:3px;line-height:1.4}
.lg-d{display:none;padding:0 0 12px}
.lg.open .lg-d{display:block}
.tg{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;border-radius:999px;margin-left:6px;border:1px solid currentColor;white-space:nowrap}
.oi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-top:6px;background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--dg);border-radius:10px;text-align:left}
.oi b{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Sổ giao dịch v58: dễ hiểu hơn */
.lg-k{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.3px;padding:1px 8px;border-radius:999px;margin-bottom:3px;border:1px solid currentColor}
.lg-r .lg-k{display:inline-block}
.lg-r b{margin-top:1px}
.lg-r small{display:block;margin-top:3px}
.lg-t{font-size:16px}
.lg-c{font-size:13.5px;margin-top:3px;color:var(--ink);line-height:1.4}
.lg-sp{margin-top:8px;border:1px solid var(--ln);border-radius:10px;overflow:hidden;font-size:13px}
.lg-sp div{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-bottom:1px solid var(--ln)}
.lg-sp div:last-child{border-bottom:0}
.lg-guide{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5;margin:6px 0 4px}
.odfx{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:8px;padding:10px 16px;background:var(--sf);border-top:1px solid var(--ln);box-shadow:0 -6px 16px rgba(0,0,0,.25)}
</style>
</head>
<body>
<header><h1 id="sn"></h1></header>
<main id="v"></main>
<button id="cb" onclick="openCart()"></button>
<nav>
<button data-t="sell" onclick="go('sell')">Bán hàng</button>
<button data-t="prod" onclick="go('prod')">Sản phẩm</button>
<button data-t="cus" onclick="go('cus')">Khách hàng</button>
<button data-t="rep" onclick="go('rep')">Báo cáo</button>
<button data-t="set" onclick="go('set')">Cài đặt</button>
</nav>
<div id="m" onclick="if(event.target===this)closeM()"></div>
<div id="toast"></div>
<script>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Math.round(n).toLocaleString('vi-VN')+' đ';
let S={products:[],sales:[],customers:[],pays:[],rets:[],tags:['Tiền mặt','Chuyển khoản'],store:'Cửa hàng của tôi',seq:0};
try{const r=localStorage.getItem('pos_v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(k){_sd=null;if(!k)S.mod=Date.now();try{localStorage.setItem('pos_v1',JSON.stringify(S))}catch(e){toast('Không lưu được dữ liệu. Hãy xem cảnh báo ở đầu trang.')}if(!k)bkSoon()}
let _sd=null,tab='sell',q='',cart={},disc=0,paid='0',per='today',cust='',cq='',pimg='',cf='in',rq={},rs=null,rm='cash',ptag=S.lastTag||'',pnote='',pnote2='',payId='',payAmt=null;
const prod=id=>S.products.find(p=>p.id===id);
const avail=p=>p.od||p.stock===null||p.stock===undefined?Infinity:p.stock;
const sub=()=>Object.keys(cart).reduce((a,id)=>a+(prod(id)?prod(id).price*cart[id]:0),0);
const total=()=>Math.max(0,sub()-disc);
const cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2000)}
function modal(h){$('#m').innerHTML='<div class="box">'+h+'</div>';$('#m').classList.add('open')}
function closeM(){$('#m').classList.remove('open')}
function ask(msg,fn){window._f=fn;modal(`<h2>${msg}</h2><div class="acts"><button class="btn" onclick="closeM()">Hủy</button><button class="btn p" onclick="closeM();_f()">Đồng ý</button></div>`)}
function bar(){const n=cnt(),b=$('#cb');b.style.display=n&&tab==='sell'?'flex':'none';b.innerHTML=`<span>${n} món · Xem giỏ hàng</span><b>${money(total())}</b>`}
/* Thông báo gộp: một thanh duy nhất, bấm để xem chi tiết */
function noticeItems(){
 const it=[];
 if(!stoOK)it.push({l:'dg',s:1,i:'⛔',t:'Máy đang chặn lưu dữ liệu, dữ liệu sẽ mất khi thoát. Hãy mở app bằng link riêng của bạn (Netlify/Cloudflare) trong Safari hoặc Chrome.'});
 else if(window.self!==window.top)it.push({l:'dg',s:1,i:'⛔',t:'Bạn đang mở bản trong Claude, có thể mất dữ liệu. Hãy dùng link riêng của bạn.'});
 const sh=shList().length;if(sh)it.push({l:'dg',i:'🚚',t:sh+' đơn có hàng quá '+SHDf()+' ngày chưa giao khách',a:'shM()',b:'Xem'});
 const ov=ovList().length;if(ov)it.push({l:'or',i:'⏳',t:ov+' đơn order quá '+OVDf()+' ngày hàng chưa về',a:'ovM()',b:'Xem'});
 if(bkNeeded())it.push({l:'ac',i:'💾',t:'Dữ liệu mới chưa được sao lưu ra ngoài máy',a:'doBackup()',b:'Sao lưu'});
 return tab==='set'?it.filter(x=>x.s):it;
}
function notice(){
 const it=noticeItems();if(!it.length)return '';
 const f=it[0],n=it.length,act=n>1?'ntList()':(f.a||'');
 return `<div class="nt ${f.l}${f.s?' wrap':''}"${act?` onclick="${act}"`:''}><span class="ni">${f.i}</span><span class="nx">${n>1?'<b>'+n+' việc cần xử lý</b> '+it.map(x=>x.i).join(' '):esc(f.t)}</span>${n>1?'<span class="nc">›</span>':f.a?`<span class="nb">${f.b}</span>`:''}</div>`;
}
function ntList(){
 const it=noticeItems();
 modal(`<h2>Việc cần xử lý</h2>`+it.map(x=>`<div class="row nr ${x.l}"${x.a?` onclick="${x.a}"`:' style="cursor:default"'}><span class="ni">${x.i}</span><span style="flex:1">${esc(x.t)}</span>${x.a?`<span class="nb">${x.b}</span>`:''}</div>`).join('')+`<div class="acts"><button class="btn p" style="flex:1" onclick="closeM()">Đóng</button></div>`);
}
function render(){_sd=null;
 $('#sn').textContent=S.store;
 $('#v').innerHTML=notice()+{sell:sellV,prod:prodV,cus:cusV,rep:repV,set:setV}[tab]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));applyNav();if(tab==='set')loadSnaps();
 bar();
}
/* Bán hàng */
function cats(){return [...new Set(S.products.map(p=>p.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'))}
function togView(){S.view=S.view==='list'?'grid':'list';save();render()}
function sellV(){return `<div style="display:flex;gap:8px"><input class="in" style="flex:1;min-width:0" placeholder="Tìm sản phẩm" value="${esc(q)}" oninput="q=this.value;$('#grid').innerHTML=grid()"><button class="btn" style="white-space:nowrap" onclick="togView()">${S.view==='list'?'Dạng ô':'Danh sách'}</button></div>${chips()}<div id="grid" class="${S.view==='list'?'ls':''}">${grid()}</div>`}
function grid(){
 if(!S.products.length)return `<div class="empty">Chưa có sản phẩm nào.<br><button class="btn p" onclick="go('prod')">Thêm sản phẩm</button></div>`;
 const l=hs(pl(cf==='od'?'in':cf).filter(p=>nz(p.name).includes(nz(q))),q);
 if(!l.length)return '<div class="empty">Không có sản phẩm nào trong mục này.</div>';
 return l.map(p=>`<div class="pc ${avail(p)<=0?'out':''}${cart[p.id]?' sel':''}" onclick="add('${p.id}')">${p.img?`<img src="${p.img}" alt="">`:''}<b>${esc(p.name)}</b><span>${money(p.price)}</span><i>${p.od?'Hàng order':p.stock==null?'Không theo dõi kho':avail(p)<=0?'Hết hàng':'Còn '+p.stock}</i>${cart[p.id]?`<div class="st"><button onclick="event.stopPropagation();adj('${p.id}',-1)">−</button><b>${cart[p.id]}</b><button onclick="event.stopPropagation();adj('${p.id}',1)">+</button></div>`:''}</div>`).join('');
}
function adj(id,d){const p=prod(id),n=(cart[id]||0)+d;if(d>0&&n>avail(p)){toast('Không đủ hàng trong kho');return}if(n<=0)delete cart[id];else cart[id]=n;$('#grid').innerHTML=grid();bar()}
function add(id){bumpP(id);const p=prod(id);if((cart[id]||0)>=avail(p)){toast('Không đủ hàng trong kho');return}cart[id]=(cart[id]||0)+1;$('#grid').innerHTML=grid();bar()}
function chg(id,d){const p=prod(id),n=(cart[id]||0)+d;if(d>0&&n>avail(p)){toast('Không đủ hàng trong kho');return}
 if(n<=0)delete cart[id];else cart[id]=n;
 $('#grid').innerHTML=grid();
 if(!cnt()){closeM();bar()}else openCart()}
function clearCart(){cart={};disc=0;paid='0';cust='';pnote='';ordFrom='';closeM();$('#grid').innerHTML=grid();bar()}
function openCart(){
 const ids=Object.keys(cart);if(!ids.length)return;
 modal(`<h2>Giỏ hàng</h2>`+ids.map(id=>{const p=prod(id);return `<div class="row"><div><b>${esc(p.name)}</b><br><small style="color:var(--ok);font-weight:600">${money(p.price)} × ${cart[id]} = ${money(p.price*cart[id])}</small></div><div class="q"><button onclick="chg('${id}',-1)">−</button><b>${cart[id]}</b><button onclick="chg('${id}',1)">+</button></div></div>`}).join('')+
 `<label>Khách hàng</label>${custRow()}<label>Giảm giá (nghìn đồng, 10 = 10.000)</label><input class="in" type="number" inputmode="decimal" step="any" value="${disc?disc/1000:''}" oninput="disc=Math.round((+this.value||0)*1000);upd()"><div class="mu" id="dsp" style="font-size:13px;margin-top:4px"></div>

/* Công nợ theo từng hóa đơn: mô phỏng theo thời gian. Tiền khách trả / tiền thừa / hoàn hàng trừ vào hóa đơn nợ cũ nhất trước */
function sdMap(){
 if(_sd)return _sd;
 const R={inv:{},ev:{},open:{}};
 const cids=[...new Set(S.sales.filter(s=>s.cid).map(s=>s.cid))];
 cids.forEach(cid=>{
  const E=[];
  S.sales.filter(s=>s.cid===cid).forEach(s=>E.push({t:s.t,k:'s',s}));
  (S.pays||[]).filter(p=>p.cid===cid).forEach(p=>E.push({t:p.t,k:'p',p}));
  (S.rets||[]).filter(r=>r.cid===cid&&r.dc>0).forEach(r=>E.push({t:r.t,k:'r',r}));
  E.sort((a,b)=>a.t-b.t||({s:0,p:1,r:2}[a.k]-{s:0,p:1,r:2}[b.k]));
  const open=[];let credit=0;
  const apply=(amt,lb,t)=>{const lines=[];for(const o of open){if(amt<=0)break;if(o.rem<=0)continue;const u=Math.min(o.rem,amt);o.rem-=u;amt-=u;lines.push({sid:o.s.id,n:o.s.n,amt:u,rem:o.rem});R.inv[o.s.id].sets.push({amt:u,lb,t})}return{lines,left:amt}};
  E.forEach(e=>{
   if(e.k==='s'){
    const s=e.s,own=Math.max(0,s.total-s.paid);let info={lines:[],left:0};
    if(s.dp>0)info=apply(s.dp,'tiền thừa của HĐ #'+s.n,s.t);
    R.inv[s.id]={own,rem:own,sets:[]};
    const o={s,rem:own};open.push(o);
    if(credit>0&&own>0){const u=Math.min(credit,own);o.rem-=u;credit-=u;R.inv[s.id].sets.push({amt:u,lb:'số dư của khách từ trước',t:s.t})}
    info.old=open.filter(q=>q!==o&&q.rem>0).map(q=>({n:q.s.n,rem:q.rem}));info.cur=o.rem;
    R.ev['s'+s.id]=info;
   }else if(e.k==='p'){
    const r=apply(e.p.amt+(e.p.ds||0),'khách trả tiền',e.t);credit+=r.left;R.ev['p'+e.p.id]=r;
   }else{
    const r=apply(e.r.dc,'hoàn hàng HĐ #'+e.r.n,e.t);credit+=r.left;R.ev['r'+(e.r.id||e.t)]=r;
   }
  });
  open.forEach(o=>{R.inv[o.s.id].rem=o.rem});
  R.open[cid]=open.filter(o=>o.rem>0).map(o=>({s:o.s,rem:o.rem}));
 });
 return _sd=R;
}
function sdRem(s){const x=sdMap().inv[s.id];return x?Math.round(x.rem):0}

function nSale(s){
 const inf=sdMap().inv[s.id];if(!inf)return '';const i=sdMap().ev['s'+s.id]||{lines:[],left:0};let h='';
 const own=Math.max(0,s.total-s.paid),ex=s.paid-s.total;
 if(own>0){h+=nmt('var(--dg)',s.paid>0?`Hàng <b>${money(s.total)}</b>, khách đưa <b>${money(s.paid)}</b>, còn thiếu <b>${money(own)}</b> → ghi nợ, cộng vào công nợ`:`Hàng <b>${money(s.total)}</b>, chưa thanh toán → ghi nợ <b>${money(own)}</b> vào công nợ`);
  const od=i.old||[],os=od.reduce((a,x)=>a+x.rem,0),cur=i.cur!=null?i.cur:own;
  h+=nmt('',od.length?`Nợ cũ lúc đó: ${od.map(x=>`HĐ #${x.n} còn <b>${money(x.rem)}</b>`).join(' + ')}<br>Tổng nợ lúc đó: ${od.length>1?money(os)+' + ':money(os)+' + '}<b>${money(cur)}</b> (HĐ #${s.n}) = <b style="color:var(--dg)">${money(os+cur)}</b>`:`Trước đó khách không nợ hóa đơn nào → tổng nợ lúc đó: <b style="color:var(--dg)">${money(cur)}</b>`)}
 else if(ex>0){
  h+=nmt('',`Hàng <b>${money(s.total)}</b>, khách đưa <b>${money(s.paid)}</b>, thừa <b>${money(ex)}</b>`);
  i.lines.forEach(l=>{h+=nmt('',`→ <b>${money(l.amt)}</b> tiền thừa trừ vào HĐ #${l.n} · ${remTx(l)}`)});
  const back=ex-(s.dp||0)+i.left;if(back>0)h+=nmt('',`→ <b>${money(back)}</b> còn lại là tiền thừa (không còn nợ để trừ)`);
 }
 if(own>0&&inf.sets.length){inf.sets.forEach(x=>{h+=nmt('var(--ok)',`${dt(x.t)}: đã trừ nợ <b>${money(x.amt)}</b> (${esc(x.lb)})`)});
  h+=nmt('',inf.rem>0?`Hiện còn nợ lại <b style="color:var(--dg)">${money(inf.rem)}</b>`:`Hóa đơn này đã thanh toán đủ`)}
 return h}

let dm=null;
function dayData(k){
 const y=Math.floor(k/12),m=k%12,a=[];
 for(let d=1;d<=new Date(y,m+1,0).getDate();d++)a.push({d,rev:0,n:0});
 S.sales.forEach(s=>{const t=new Date(s.t);if(t.getFullYear()===y&&t.getMonth()===m){a[t.getDate()-1].rev+=s.total;a[t.getDate()-1].n++}});

function dailyV(){

 const y=Math.floor(dm/12),m=dm%12,a=dayData(dm),tot=a.reduce((s,x)=>s+x.rev,0),inv=a.reduce((s,x)=>s+x.n,0),mx=Math.max(...a.map(x=>x.rev),1),bw=340/a.length;
 const bars=a.map((x,i)=>{const h=Math.max(0,Math.round(x.rev/mx*90));return `<rect x="${i*bw+1}" y="${125-h}" width="${Math.max(bw-2,2)}" height="${x.rev>0?Math.max(h,2):0}" rx="2" style="fill:var(--ac)"/>`+(x.rev>0?`<text transform="translate(${i*bw+bw/2+3},${125-h-4}) rotate(-90)" font-size="8" style="fill:var(--ink)">${fmM(x.rev)}</text>`:'')+((x.d===1||x.d%5===0||x.d===a.length)?`<text x="${i*bw+bw/2}" y="142" text-anchor="middle" font-size="9" style="fill:var(--mu)">${x.d}</text>`:'')}).join('');
 let rows='';
 for(let i=a.length-1;i>=0;i--){
  const x=a[i];if(!x.n&&!x.rev)continue;
  const p=i>0?a[i-1]:null,g=p&&p.rev>0?(x.rev-p.rev)/p.rev*100:null;
  rows+=`<div class="row"><div><b>Ngày ${String(x.d).padStart(2,'0')}/${String(m+1).padStart(2,'0')}/${y}</b><br><small class="mu">${x.n} hóa đơn</small></div><div style="text-align:right"><b>${money(x.rev)}</b><br><small style="color:${g!==null&&g<0?'var(--dg)':'var(--ac)'}">${g===null?'Không có ngày trước để so sánh':(g>=0?'+':'−')+Math.abs(Math.round(g))+'% so với ngày trước'}</small></div></div>`;
 }
 return perSel()+`<div class="bar" style="margin-top:10px;gap:8px"><button class="btn" onclick="dm--;render()">‹</button><input class="in" type="month" style="flex:1;text-align:center" value="${y}-${String(m+1).padStart(2,'0')}" onchange="const v=this.value.split('-');if(v.length==2){dm=+v[0]*12+(+v[1]-1);render()}"><button class="btn" ${dm>=cur?'disabled style="opacity:.4"':''} onclick="dm++;render()">›</button></div><div class="stat"><div class="w" style="padding-bottom:6px"><small>Tháng ${m+1}/${y} · Tổng ${money(tot)} · ${inv} hóa đơn · số trên cột: triệu đồng</small><svg viewBox="0 0 340 150" width="100%" role="img" aria-label="Biểu đồ doanh thu theo ngày">${bars}</svg></div></div>${rows||'<div class="empty">Tháng này chưa có hóa đơn.</div>'}`;
}

  if(p.od||p.stock==null)return {t:'none',n:0};
  const n=Math.min(+o.qty||0,Math.max(0,p.stock-oq));
  return n>0?{t:'part',n}:{t:'none',n:0};
 }
 window.ordCancelAsk=function(id,ctx){
  const o=OR().find(x=>x.id===id);if(!o||!oAct(o))return;
  const p=prod(o.pid),c=cus(o.cid),others=OR().some(x=>x.id!==id&&x.pid===o.pid&&oAct(x));
  let inv='';
  const mvp=cxMove(o);
  if(p)inv=mvp.t==='none'?'<div class="mu" style="font-size:13px;margin-top:10px">Còn khách khác đang đặt món này nên chưa chuyển vào tồn kho.</div>':'<div class="mu" style="font-size:13px;margin-top:10px">'+(mvp.t==='part'?mvp.n+' cái sẽ tách sang mục ':'Hàng sẽ tự chuyển vào mục ')+esc(cxTab())+(mvp.t==='part'?', phần còn lại giữ cho khách khác.':'.')+'</div>';
  modal(`<h2 style="color:var(--dg)">Hủy đặt</h2><div class="row" style="cursor:default"><div><b style="color:var(--pu)">${c?esc(c.name):'(khách đã xóa)'}</b><br><small class="mu">${esc(p?p.name:'(đã xóa)')} × ${o.qty} · Đặt ${fd(o.t)} · Cọc ${money(o.dep)}</small></div></div>${o.dep>0?'<div class="mu" style="font-size:13px;margin-top:8px">Tiền cọc '+money(o.dep)+' sẽ được ghi là hoàn lại cho khách.</div>':''}<label>Ghi chú hủy đặt</label><input class="in" id="ocn" placeholder="vd: khách đổi ý, không cần nữa...">${inv}<div class="acts"><button class="btn" onclick="closeM()">Quay lại</button><button class="btn d" onclick="ordCancelDo('${id}','${ctx}')">Xác nhận hủy đặt</button></div>`);
 };
 window.ordCancelDo=function(id,ctx){
  const o=OR().find(x=>x.id===id);if(!o||!oAct(o)){closeM();return}
  const n=($('#ocn')?$('#ocn').value:'').trim(),p=prod(o.pid),mvp=cxMove(o);
  if(o.dep>0)(S.deps=S.deps||[]).push({id:uid(),oid:id,t:Date.now(),pm:o.dpm||'',v:-o.dep,cid:o.cid,pn:'Hoàn cọc'});
  o.st='cancel';o.ct=Date.now();if(p)o.cp=+p.price||0;if(n)o.cnote=n;
  if(p&&mvp.t==='all'){if(p.od){p.od=false;p.stock=(+p.stock||0)+o.qty;p.av=Date.now()}if(PT().some(t=>t.k==='om'))p.tg='om';else delete p.tg;o.mv=1}
  else if(p&&mvp.t==='part'){const c={...p,id:uid(),stock:mvp.n};if(PT().some(t=>t.k==='om'))c.tg='om';else delete c.tg;p.stock-=mvp.n;S.products.push(c);o.mv=1}
  save();closeM();render();toast('Đã hủy đặt'+(o.mv?', hàng đã vào tồn kho':''));
  if(ctx==='cus')cusD(o.cid);else ordMgr(o.pid);
 };
 ordDel=function(id,pid){ordCancelAsk(id,'prod')};
 ordOf=function(cid){
  ordCid=cid;
  const l=OR().filter(o=>o.cid===cid&&oAct(o)).sort((a,b)=>b.t-a.t),cx=OR().filter(o=>o.cid===cid&&o.st==='cancel').sort((a,b)=>(b.ct||0)-(a.ct||0)).slice(0,5);
  if(!l.length&&!cx.length)return '';
  const ar=l.filter(ordArr);
  return (l.length?`<div class="mu" style="margin-top:10px"><b>Đang đặt order · ${l.length} đơn đặt <span class="gr">(${ar.length} đã về)</span></b></div>`+l.map(o=>{const p=prod(o.pid),ok=ordArr(o);return `<div class="row"${ok?` onclick="ordTog('${o.id}')"`:''}>${ok?`<input type="checkbox" class="ckb" id="oc_${o.id}" ${ordSel.has(o.id)?'checked':''} style="pointer-events:none" tabindex="-1">`:''}<div style="flex:1"><b>${esc(p?p.name:'(đã xóa)')} × ${o.qty}</b><br><small class="mu">Đặt ${fd(o.t)} · Cọc ${money(o.dep)}${o.tt?' · đã báo hàng về '+fd(o.tt):''}${ok?' · <span class="gr">hàng đã về'+(p.av?' '+fd(p.av):'')+'</span>':' · chưa về'}</small></div><button class="btn d" style="padding:8px 10px;align-self:center" onclick="event.stopPropagation();ordCancelAsk('${o.id}','cus')">Hủy đặt</button></div>`}).join('')+(ar.length?`<div class="acts" style="justify-content:flex-end;margin:10px 0 4px"><button class="btn" id="ost" style="padding:8px 14px;font-size:14px" onclick="ordTogAll('${cid}')">Chọn</button><button class="btn p" id="osb" style="padding:8px 14px;font-size:14px;white-space:nowrap" onclick="ordSellSel('${cid}')">Bán các món đã chọn (${ordSel.size})</button></div>`:''):'');
 };
 const _rv=repV;
 repV=function(){
  const r=_rv();
  if(per==='daily'||per==='pm'||per==='chart')return r;
  const l=OR().filter(o=>o.st==='cancel'&&(o.ct||o.t)>=RF&&(o.ct||o.t)<RT).sort((a,b)=>(b.ct||b.t)-(a.ct||a.t)).slice(0,30);
  if(!l.length)return r;
  return r+`<h2 style="font-size:16px;margin:18px 0 0;color:var(--dg)">Hủy đặt (${l.length})</h2>`+l.map(o=>{const c=cus(o.cid),p=prod(o.pid);return `<div class="row" style="cursor:default;border-left:4px solid var(--dg);padding-left:10px"><div><b style="color:var(--dg)">${esc(p?p.name:'(đã xóa)')} × ${o.qty}</b><br><small class="mu">${dt(o.ct||o.t)}${c?' · <span style="color:var(--pu);font-weight:600">'+esc(c.name)+'</span> · '+phs(c):''}${o.dep>0?' · hoàn cọc '+money(o.dep):''}${o.mv?' · hàng vào tồn kho':''}${o.cnote?'<br>Ghi chú: '+esc(o.cnote):''}</small></div><b style="color:var(--dg)">HỦY</b></div>`}).join('');
 };
 const _cr=custRow;custRow=function(){const r=_cr();return cus(cust)?r.replace('<span>','<span style="'+B+'">'):r};
 const _cl=cList;cList=function(k){return _cl(k).replace(/<div><b>/g,'<div><b style="color:var(--pu)">')};
 const _cu=cusL;cusL=function(){return _cu().replace(/<div style="flex:1"><b>/g,'<div style="flex:1"><b style="color:var(--pu)">')};
 cnc=function(s){return s.cn?' · <span style="'+B+'">'+esc(s.cn)+'</span>'+(s.cp?' · <span style="color:var(--pu)">'+esc(s.cp)+'</span>':''):''};
 const _rc=rcHtml;
 rcHtml=function(s){
  let r=_rc(s).replace(/<b>• /g,'<b style="color:var(--ac)">• ');
  if(s.cn)r=r.replace('Khách: '+esc(s.cn)+' - '+esc(s.cp),'Khách: <span style="'+B+'">'+esc(s.cn)+'</span> - <span style="color:var(--pu)">'+esc(s.cp)+'</span>');
  return r;
 };
})();
(function(){try{if(!S.products.length)return;const l=OR().filter(o=>oAct(o)&&!prod(o.pid));if(!l.length)return;l.forEach(o=>{if(o.dep>0)(S.deps=S.deps||[]).push({id:uid(),oid:o.id,t:Date.now(),pm:o.dpm||'',v:-o.dep,cid:o.cid,pn:'Hoàn cọc (xóa hàng)'})});S.ords=OR().filter(o=>!l.includes(o));save()}catch(e){}})();
</script>
